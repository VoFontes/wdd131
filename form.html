<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <meta name="description"
        content="Product review form for submitting a review, rating, installation date, and useful features.">

    <meta name="author" content="Victor O. Fontes">

    <title>Product Review Form</title>

    <link rel="stylesheet" href="styles/form.css">
    <script src="scripts/form.js" defer></script>
</head>

<body>

    <header>
        <h1>Product Review</h1>
    </header>

    <main>
        <form method="get" action="review.html">

            <fieldset>
                <legend>Product Review</legend>

                <!-- Product Name -->
                <label for="product">
                    Product Name <span class="required">*</span>
                </label>

                <select id="product" name="product" required>
                    <option value="" disabled selected>Select a Product ...</option>
                </select>

                <!-- Overall Rating -->
                <fieldset class="rating-field">
                    <legend>Overall Rating <span class="required">*</span></legend>

                    <div class="rating-options">

                        <label for="rating-1">
                            <input type="radio" id="rating-1" name="rating" value="1" required>
                            <span>☆</span>
                            <span class="sr-only">1 star</span>
                        </label>

                        <label for="rating-2">
                            <input type="radio" id="rating-2" name="rating" value="2" required>
                            <span>☆☆</span>
                            <span class="sr-only">2 stars</span>
                        </label>

                        <label for="rating-3">
                            <input type="radio" id="rating-3" name="rating" value="3" required>
                            <span>☆☆☆</span>
                            <span class="sr-only">3 stars</span>
                        </label>

                        <label for="rating-4">
                            <input type="radio" id="rating-4" name="rating" value="4" required>
                            <span>☆☆☆☆</span>
                            <span class="sr-only">4 stars</span>
                        </label>

                        <label for="rating-5">
                            <input type="radio" id="rating-5" name="rating" value="5" required>
                            <span>☆☆☆☆☆</span>
                            <span class="sr-only">5 stars</span>
                        </label>

                    </div>
                </fieldset>

                <!-- Date of Installation -->
                <label for="installation-date">
                    Date of Installation <span class="required">*</span>
                </label>

                <input type="date" id="installation-date" name="installation-date" required>

                <!-- Useful Features -->
                <fieldset>
                    <legend>Which features did you find useful?</legend>

                    <label for="durability">
                        <input type="checkbox" id="durability" name="features" value="durability">
                        Durability
                    </label>

                    <label for="ease-of-use">
                        <input type="checkbox" id="ease-of-use" name="features" value="ease-of-use">
                        Ease of Use
                    </label>

                    <label for="performance">
                        <input type="checkbox" id="performance" name="features" value="performance">
                        Performance
                    </label>

                    <label for="design">
                        <input type="checkbox" id="design" name="features" value="design">
                        Design
                    </label>

                </fieldset>

                <!-- Written Review -->
                <label for="review">
                    Written Review
                </label>

                <textarea id="review" name="review" rows="6"></textarea>

                <!-- User Name -->
                <label for="user-name">
                    Your Name
                </label>

                <input type="text" id="user-name" name="user-name">

                <!-- Submit -->
                <input type="submit" value="Post Review">

            </fieldset>

        </form>
    </main>

    <footer>
        <p>
            &copy; <span id="currentyear"></span> Victor O. Fontes | Utah, USA
        </p>

        <p id="lastModified"></p>
    </footer>

</body>

</html>
